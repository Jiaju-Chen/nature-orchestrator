schema_version: nature_orchestrator.skill_manifest.v1
skill_version: v0_1_generic_full_paper
name: Generic evidence-grounded full-paper writing
status: release_candidate
scope:
  primary_task: generic scientific manuscript section drafting
  target_style: nature_research_article
  benchmark_dependency: optional
  oracle_required: false
backends:
  prompt-pack:
    status: supported
    description: Writes prompt packs and provenance without calling a model.
  codex:
    status: supported
    description: Calls Codex CLI with the generated prompt pack when available.
  api:
    status: planned
    description: Reserved for future OpenAI-compatible or provider API backends.
artifacts:
  prompts:
    - prompts/writer.md
    - prompts/reviewer.md
    - prompts/refiner.md
    - prompts/polisher.md
    - prompts/orchestrator.md
  rubrics:
    - rubrics/evidence_grounding.yaml
    - rubrics/story_quality.yaml
  contracts:
    - contracts/manuscript_workspace.yaml
policies:
  evidence_only: true
  no_oracle_by_default: true
  no_direct_web_by_default: true
  benchmark_oracle_mode: evaluation_only
