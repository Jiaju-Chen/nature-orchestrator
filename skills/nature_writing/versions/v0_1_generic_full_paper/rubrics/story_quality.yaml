schema_version: nature_orchestrator.rubric.v1
name: story_quality
scores:
  5: The manuscript has a clear question, gap, evidence sequence, contribution, limitation, and field-level implication.
  4: The main story is clear with minor transition or emphasis issues.
  3: The draft is understandable but reads like a summary rather than a scientific argument.
  2: The story is fragmented; section roles and evidence hierarchy are unclear.
  1: The draft lacks a coherent scientific argument.
review_dimensions:
  - central_question
  - gap_ladder
  - evidence_sequence
  - figure_driven_progression
  - limitation_calibration
  - contribution_specificity
